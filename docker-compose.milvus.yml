# DEPRECATED — Milvus is now part of the main stack.
# Prefer one-shot:
#   docker compose up -d --build
#
# This file is kept only for old scripts that still pass -f docker-compose.milvus.yml.
# Do not run it together with the main compose (same container name / ports).

name: opspilot-milvus

services:
  milvus:
    container_name: opspilot-milvus
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 90s
      timeout: 20s
      retries: 12

volumes:
  milvus_data:
