# ---------------------------------------------------------------------------
# E7 — 多轮上下文核心
# ---------------------------------------------------------------------------

- id: e7_consult_then_escalate
  suite: E7_multi_turn
  priority: P0
  turns:
    - question: checkout接口502
      required_tools:
        - [list_services, get_service_status]
        - search_knowledge
        - search_tickets
      forbidden_tools:
        - create_ticket
        - update_ticket
        - create_permission
      expect_interrupt: false
      text_must:
        - 问题判断
        - 是否需要升级处理
      text_must_not:
        - 已为你创建
    - question: 是，请升级处理
      required_tools:
        - create_ticket
      forbidden_tools:
        - create_permission
      expect_interrupt: true
      text_must:
        - 需要你确认
      text_must_not:
        - 已为你创建

- id: e7_followup_status_ellipsis
