# ---------------------------------------------------------------------------
# E2 — 明确升级 + HITL
# ---------------------------------------------------------------------------

- id: e2_checkout_explicit_create
  suite: E2_escalation_hitl
  priority: P0
  question: checkout接口502，帮我提交工单
  required_tools:
    - create_ticket
  forbidden_tools:
    - create_permission
    - get_my_permissions
    - get_my_tickets
  expect_interrupt: true
  text_must:
    - 需要你确认
  text_must_not:
    - 已为你创建
  notes: interrupt 时可见回复是 HITL 提示，不是六块模板

- id: e2_create_approve_persists
  suite: E2_escalation_hitl
  priority: P0
  question: checkout接口502，帮我提交工单
  required_tools:
    - create_ticket
  forbidden_tools:
    - create_permission
  expect_interrupt: true
  resume: approve
  text_must:
    - 工单
  text_must_not:
    - create_ticket success
    - ok:true

- id: e2_create_reject_no_row
  suite: E2_escalation_hitl
  priority: P0
  question: checkout接口502，帮我提交工单
  required_tools:
    - create_ticket
  forbidden_tools:
    - create_permission
  expect_interrupt: true
  resume: reject
  text_must:
    - 取消
  text_must_not:
    - 已为你创建

