# Phase C-4.3 — V1 金标（Hardening H3）
# 文件：agent/app/evaluation/v1/cases_c42.yaml
# 入口：cd agent && python -m app.evaluation.runner --v1
# 设计：docs/phases/PHASE_C42_AGENT_EVALUATION_DESIGN.md
# 分类映射（不改字段，只注释）：
#   RAG     — E1 调查含 search_knowledge；E3 no-result/拒答；E5 禁假知识/假单号
#   Tool    — E1 routing；E2 HITL/parameter；forbidden_tools 禁 Permission
#   Business— E1 分析不建单；E2/E7 工单升级与多轮
#   Security— E4 prompt injection；E6 授权/thread 隔离
# P1 不在本文件。
# HITL：interrupt 时 tools_called 仅含写工具（现有 Graph，评测侧不改）。

# ---------------------------------------------------------------------------
# E1 — 正常故障分析（默认不建单）
# ---------------------------------------------------------------------------

- id: e1_checkout_consult_no_ticket
  suite: E1_normal_analysis
  priority: P0
  question: checkout接口502
  required_tools:
    - [list_services, get_service_status]
    - search_knowledge
    - search_tickets
  forbidden_tools:
    - create_ticket
    - update_ticket
    - create_permission
    - get_my_permissions
    - get_my_tickets
  expect_interrupt: false
  text_must:
    - 问题判断
    - 当前状态
    - 知识依据
    - 历史参考
    - 建议操作
    - 是否需要升级处理
  text_must_not:
    - 已为你创建
    - 正在为您创建工单
    - 已确认根因
    - OPS-V1-2003
  notes: C-4 Case A

- id: e1_order_worker_down_consult
