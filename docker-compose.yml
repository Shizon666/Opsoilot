# OpsPilot — Docker Compose (one-shot local stack)
# Usage: docker compose up -d --build
# Services: postgres + backend + milvus + agent
# Agent Checkpoint DB: opspilot_agent (isolated from Go business DB opspilot).
# Host-side RAG CLI (load/chunk/index) still uses MILVUS_URI=http://127.0.0.1:19530.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opspilot} -d ${POSTGRES_DB:-opspilot}"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - opspilot

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://opspilot:opspilot@postgres:5432/opspilot?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-dev}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - opspilot

  milvus:
    image: milvusdb/milvus:v3.0.0
    container_name: opspilot-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 90s
      timeout: 20s
      retries: 12
    networks:
      - opspilot

  agent:
    build:
      context: ./agent
    ports:
      - "${AGENT_PORT:-8000}:8000"
    environment:
      AGENT_HOST: ${AGENT_HOST:-0.0.0.0}
      AGENT_PORT: ${AGENT_PORT:-8000}
      BUSINESS_API_BASE_URL: ${BUSINESS_API_BASE_URL:-http://backend:8080}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-dev}
      KNOWLEDGE_RUNBOOK_DIR: ${KNOWLEDGE_RUNBOOK_DIR:-/app/knowledge/runbooks}
      KNOWLEDGE_INDEX_DIR: ${KNOWLEDGE_INDEX_DIR:-/app/data/knowledge_index}
      HF_HOME: ${HF_HOME:-/app/data/hf_cache}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # Checkpoint DB (not Go business DB)
      CHECKPOINT_BACKEND: ${CHECKPOINT_BACKEND:-postgres}
      CHECKPOINT_DATABASE_URL: ${CHECKPOINT_DATABASE_URL:-postgres://opspilot:opspilot@postgres:5432/opspilot_agent?sslmode=disable}
      # RAG — inside compose network use service DNS (override host .env 127.0.0.1)
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      EMBED_MODEL_NAME: ${EMBED_MODEL_NAME:-BAAI/bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-knowledge_docs}
    volumes:
      - ./agent/knowledge:/app/knowledge:ro
      - ./agent/data:/app/data
      # Host RAG CLI paths: repo_root()/knowledge/ops → /knowledge/ops inside image layout
      - ./knowledge:/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
      milvus:
        condition: service_healthy
    networks:
      - opspilot

networks:
  opspilot:
    driver: bridge

volumes:
  postgres_data:
  milvus_data:
